# Kubernetes Secrets Configuration
# IMPORTANT: Do not commit this file with actual secrets!
# Use kubectl create secret instead:
# kubectl create secret generic talentgeenie-secrets \
#   --from-literal=supabase-url=YOUR_URL \
#   --from-literal=supabase-key=YOUR_KEY \
#   --from-literal=supabase-project-id=YOUR_PROJECT_ID

apiVersion: v1
kind: Secret
metadata:
  name: talentgeenie-secrets
type: Opaque
stringData:
  supabase-url: "REPLACE_WITH_YOUR_SUPABASE_URL"
  supabase-key: "REPLACE_WITH_YOUR_SUPABASE_PUBLISHABLE_KEY"
  supabase-project-id: "REPLACE_WITH_YOUR_PROJECT_ID"