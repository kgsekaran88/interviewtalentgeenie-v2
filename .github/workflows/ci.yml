# =============================================================================
# TalentGeenie — CI/CD Pipeline
# =============================================================================
# Runs on push to main and pull requests.
# Jobs: lint, type-check, test, Docker build, optional deploy.
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint & Type Check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint . --max-warnings 0
        continue-on-error: true  # ~1500 lint issues outstanding — tracked separately

  # ---------------------------------------------------------------------------
  # 2. Unit Tests
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Run Vitest
        run: npm test
        env:
          VITE_SUPABASE_URL: http://localhost:8000
          VITE_SUPABASE_PUBLISHABLE_KEY: test-anon-key
          VITE_SUPABASE_PROJECT_ID: test

      - name: Run coverage (enforce thresholds)
        run: npm run test:coverage
        env:
          VITE_SUPABASE_URL: http://localhost:8000
          VITE_SUPABASE_PUBLISHABLE_KEY: test-anon-key
          VITE_SUPABASE_PROJECT_ID: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Build Docker Image
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_SUPABASE_PROJECT_ID=${{ secrets.VITE_SUPABASE_PROJECT_ID }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.supabase.yml config --quiet
        env:
          JWT_SECRET: test-secret-for-validation-only
          ANON_KEY: test-anon-key
          SERVICE_ROLE_KEY: test-service-role-key
          REALTIME_SECRET_KEY_BASE: test-realtime-secret-for-validation

  # ---------------------------------------------------------------------------
  # 4. E2E Tests (Playwright) — runs on PRs; skipped on push-to-main to
  #    avoid blocking fast deploys. Requires the Supabase stack to be running.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Run on PRs only – production deploys are gated by unit tests + build
    if: github.event_name == 'pull_request'
    services:
      # Minimal Postgres for E2E (full Supabase stack not available in CI)
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app for E2E
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost:8000
          VITE_SUPABASE_PUBLISHABLE_KEY: test-anon-key
          VITE_SUPABASE_PROJECT_ID: test

      - name: Run E2E tests
        run: npx playwright test --reporter=github
        env:
          BASE_URL: http://localhost:4173
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 5. Deploy to Production
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/app
            git pull origin main --ff-only
            docker compose \
              -f docker-compose.supabase.yml \
              -f docker-compose.deploy.yml \
              --env-file .env.production \
              pull --ignore-buildable
            docker compose \
              -f docker-compose.supabase.yml \
              -f docker-compose.deploy.yml \
              --env-file .env.production \
              build app
            docker compose \
              -f docker-compose.supabase.yml \
              -f docker-compose.deploy.yml \
              --env-file .env.production \
              up -d
            echo "✅ Deployed $(git rev-parse --short HEAD)"
