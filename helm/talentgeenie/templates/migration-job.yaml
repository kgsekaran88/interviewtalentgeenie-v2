{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "talentgeenie.fullname" . }}-migration
  labels:
    {{- include "talentgeenie.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "talentgeenie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for database to be ready..."
              until pg_isready -h {{ include "talentgeenie.databaseHost" . }} -p {{ include "talentgeenie.databasePort" . }} -U {{ .Values.postgresql.auth.username }}; do
                echo "Database not ready, waiting..."
                sleep 2
              done
              echo "Database is ready!"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-db-secret" (include "talentgeenie.fullname" .)) }}
                  key: password
                  optional: true
      containers:
        - name: migrate
          # Use the dedicated migration image that has migrations baked in
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          env:
            - name: DB_HOST
              value: {{ include "talentgeenie.databaseHost" . | quote }}
            - name: DB_PORT
              value: {{ include "talentgeenie.databasePort" . | quote }}
            - name: DB_NAME
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: DB_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-db-secret" (include "talentgeenie.fullname" .)) }}
                  key: password
                  optional: true
            - name: MIGRATIONS_DIR
              value: "/migrations"
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
{{- end }}