apiVersion: v1
kind: Secret
metadata:
  name: {{ include "talentgeenie.fullname" . }}-secrets
  labels:
    {{- include "talentgeenie.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Supabase configuration (self-hosted)
  supabase-url: "{{ .Values.supabase.url | default "http://kong:8000" }}"
  supabase-key: "{{ .Values.supabase.anonKey | default "your-anon-key" }}"
  supabase-project-id: "{{ .Values.supabase.projectId | default "self-hosted" }}"
  
  # Database URL (for migrations)
  {{- if .Values.postgresql.enabled }}
  database-url: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "talentgeenie.databaseHost" . }}:{{ include "talentgeenie.databasePort" . }}/{{ .Values.postgresql.auth.database }}"
  {{- else if .Values.externalDatabase.enabled }}
  database-url: "postgres://{{ .Values.externalDatabase.username }}@{{ .Values.externalDatabase.host }}:{{ .Values.externalDatabase.port }}/{{ .Values.externalDatabase.database }}"
  {{- end }}