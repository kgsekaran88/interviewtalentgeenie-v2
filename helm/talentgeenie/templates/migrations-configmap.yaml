{{- if .Values.migration.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "talentgeenie.fullname" . }}-migrations
  labels:
    {{- include "talentgeenie.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  # Note: In production, migrations should be baked into the migration image
  # or mounted from a persistent volume. This ConfigMap is for reference.
  README.md: |
    # Database Migrations
    
    Migration files should be included in the migration Docker image.
    Build the migration image with:
    
    ```bash
    docker build -f Dockerfile.migration -t your-registry/talentgeenie-migrate:latest .
    docker push your-registry/talentgeenie-migrate:latest
    ```
    
    Then update values.yaml:
    
    ```yaml
    migration:
      image:
        repository: your-registry/talentgeenie-migrate
        tag: latest
    ```
{{- end }}