# =============================================================================
# TalentGeenie — Self-Hosted Supabase Stack (Local Development)
# =============================================================================
# This compose file brings up the FULL Supabase backend locally:
#   PostgreSQL 15  ·  PostgREST  ·  GoTrue (Auth)  ·  Realtime
#   Storage API  ·  Kong (API Gateway)  ·  Edge Functions (Deno)
#   Studio  ·  Postgres-Meta  ·  Imgproxy
#
# Usage:
#   cp .env.supabase.example .env.supabase
#   docker compose -f docker-compose.supabase.yml --env-file .env.supabase up -d
#
# Endpoints (defaults):
#   Kong API Gateway:  http://localhost:8000  (use as VITE_SUPABASE_URL)
#   Supabase Studio:   http://localhost:3000
#   PostgreSQL:        localhost:54322
# =============================================================================

name: talentgeenie-supabase

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL — Core database
  # ---------------------------------------------------------------------------
  db:
    image: supabase/postgres:15.8.1.085
    container_name: talentgeenie-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"
    ports:
      - "${POSTGRES_PORT:-54322}:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXP:-3600}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      - ./docker/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
    networks:
      - talentgeenie-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_connections=200
    labels:
      - "com.talentgeenie.service=database"

  # ---------------------------------------------------------------------------
  # 1b. PgBouncer — Connection Pooling
  # Scales to 5000+ concurrent candidates by pooling DB connections.
  # Pool mode: transaction (releases connection after each transaction)
  # max_client_conn=1000 → handles many app services without exhausting DB.
  # default_pool_size=25 per user → keeps total connections within max_connections=200.
  # Services routed through PgBouncer: auth, rest, storage, functions.
  # Services on direct DB: realtime (needs persistent), meta, migrations.
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: talentgeenie-pgbouncer
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"
    entrypoint: ["/entrypoint-custom.sh"]
    volumes:
      - ./docker/pgbouncer-entrypoint.sh:/entrypoint-custom.sh:ro
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGBOUNCER_DB_HOST: db
      PGBOUNCER_DB_PORT: "5432"
      PGBOUNCER_LISTEN_PORT: "6432"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_DEFAULT_POOL_SIZE: "25"
      PGBOUNCER_MAX_CLIENT_CONN: "1000"
      PGBOUNCER_MAX_DB_CONNECTIONS: "100"
    networks:
      - talentgeenie-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.talentgeenie.service=pgbouncer"

  # ---------------------------------------------------------------------------
  # 2. Kong — API Gateway
  # ---------------------------------------------------------------------------
  kong:
    image: kong:2.8.1
    container_name: talentgeenie-kong
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    ports:
      - "${KONG_HTTP_PORT:-8000}:8000/tcp"
      - "${KONG_HTTPS_PORT:-8443}:8443/tcp"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - ./docker/volumes/api/kong.yml:/home/kong/temp.yml:ro
    entrypoint: >
      bash -c '
      sed "s|\$${ANON_KEY}|$$ANON_KEY|g; s|\$${SERVICE_ROLE_KEY}|$$SERVICE_ROLE_KEY|g; s|\$${FRONTEND_URL}|$$FRONTEND_URL|g" /home/kong/temp.yml > /home/kong/kong.yml &&
      /docker-entrypoint.sh kong docker-start'
    networks:
      - talentgeenie-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 5
    labels:
      - "com.talentgeenie.service=api-gateway"

  # ---------------------------------------------------------------------------
  # 3. GoTrue — Authentication
  # ---------------------------------------------------------------------------
  auth:
    image: supabase/gotrue:v2.158.1
    container_name: talentgeenie-auth
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}

      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:5173}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXP:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}

      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_SIGN_INS:-false}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: true
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@talentgeenie.local}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-inbucket}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-2500}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-TalentGeenie}

      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP:-false}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM:-false}

      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 150
    networks:
      - talentgeenie-network
    depends_on:
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.talentgeenie.service=auth"

  # ---------------------------------------------------------------------------
  # 4. PostgREST — RESTful API
  # ---------------------------------------------------------------------------
  rest:
    image: postgrest/postgrest:v12.2.0
    container_name: talentgeenie-rest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXP:-3600}
    networks:
      - talentgeenie-network
    depends_on:
      pgbouncer:
        condition: service_healthy
    command: "postgrest"
    labels:
      - "com.talentgeenie.service=rest-api"

  # ---------------------------------------------------------------------------
  # 5. Realtime — WebSocket subscriptions
  # ---------------------------------------------------------------------------
  realtime:
    image: supabase/realtime:v2.30.34
    container_name: talentgeenie-realtime
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC: "true"
      API_JWT_SECRET: ${JWT_SECRET}
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      APP_NAME: realtime
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILWIND_LOGS: "false"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DB_ENC_KEY: supabaserealtime
    networks:
      - talentgeenie-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sSf", "-o", "/dev/null", "http://127.0.0.1:4000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.talentgeenie.service=realtime"

  # ---------------------------------------------------------------------------
  # 6. Storage API — File storage
  # ---------------------------------------------------------------------------
  storage:
    image: supabase/storage-api:v1.11.13
    container_name: talentgeenie-storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:8080
    volumes:
      - storage-data:/var/lib/storage
    networks:
      - talentgeenie-network
    depends_on:
      pgbouncer:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.talentgeenie.service=storage"

  # ---------------------------------------------------------------------------
  # 7. Imgproxy — Image transformations for Storage
  # ---------------------------------------------------------------------------
  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    container_name: talentgeenie-imgproxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: ${IMGPROXY_ENABLE_WEBP_DETECTION:-true}
    volumes:
      - storage-data:/var/lib/storage:ro
    networks:
      - talentgeenie-network
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.talentgeenie.service=imgproxy"

  # ---------------------------------------------------------------------------
  # 8. Postgres Meta — Database metadata API (for Studio)
  # ---------------------------------------------------------------------------
  meta:
    image: supabase/postgres-meta:v0.84.2
    container_name: talentgeenie-meta
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - talentgeenie-network
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "com.talentgeenie.service=postgres-meta"

  # ---------------------------------------------------------------------------
  # 9. Studio — Supabase Dashboard UI
  # ---------------------------------------------------------------------------
  studio:
    image: supabase/studio:20241029-46e1e40
    container_name: talentgeenie-studio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    ports:
      - "${STUDIO_PORT:-3000}:3000/tcp"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-TalentGeenie}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-InterviewTalentGeenie}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      LOGFLARE_API_KEY: ${LOGFLARE_API_KEY:-placeholder}
      LOGFLARE_URL: http://localhost:4000
      NEXT_PUBLIC_ENABLE_LOGS: "false"
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
      HOSTNAME: 0.0.0.0
    networks:
      - talentgeenie-network
    depends_on:
      kong:
        condition: service_healthy
      meta:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/profile').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.talentgeenie.service=studio"

  # ---------------------------------------------------------------------------
  # 10. Edge Functions — Deno runtime (105 functions, zero code changes)
  # ---------------------------------------------------------------------------
  functions:
    image: supabase/edge-runtime:v1.70.3
    container_name: talentgeenie-functions
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      VERIFY_JWT: ${FUNCTIONS_VERIFY_JWT:-true}
      # App-specific secrets
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SCHEDULED_CLEANUP_SECRET: ${SCHEDULED_CLEANUP_SECRET:-local-dev-secret}
    volumes:
      - ./supabase/functions:/home/deno/functions:Z
    networks:
      - talentgeenie-network
    depends_on:
      pgbouncer:
        condition: service_healthy
      kong:
        condition: service_healthy
    command:
      - start
      - --main-service
      - /home/deno/functions/main
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.talentgeenie.service=edge-functions"

  # ---------------------------------------------------------------------------
  # 11. DB Migrations — Run app schema on top of Supabase base
  # ---------------------------------------------------------------------------
  db-migrations:
    image: supabase/postgres:15.8.1.085
    container_name: talentgeenie-db-migrations
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: supabase_admin
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./migrations/fresh-deploy:/migrations/fresh-deploy:ro
      - ./supabase/migrations:/migrations/incremental:ro
      - ./docker/volumes/db/realtime.sql:/migrations/post-setup/realtime.sql:ro
      - ./scripts/run-bootstrap.sh:/run-bootstrap.sh:ro
    networks:
      - talentgeenie-network
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/run-bootstrap.sh"]
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"
    labels:
      - "com.talentgeenie.service=db-migrations"

  # ---------------------------------------------------------------------------
  # 12. DB Backup — Daily pg_dump via supercronic cron scheduler
  # ---------------------------------------------------------------------------
  db-backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: talentgeenie-db-backup
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z6 --schema=public --blobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
      HEALTHCHECK_PORT: 8080
    volumes:
      - db-backups:/backups
    networks:
      - talentgeenie-network
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "com.talentgeenie.service=db-backup"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  db-data:
    driver: local
  storage-data:
    driver: local
  db-backups:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  talentgeenie-network:
    driver: bridge
