version: '3.8'

# Production configuration with PostgreSQL and monitoring

services:
  # Frontend application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    container_name: talentgeenie-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    networks:
      - talentgeenie-network
    depends_on:
      - db
      - migrate
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

  # PostgreSQL database (for self-hosted setup)
  db:
    image: postgres:15-alpine
    container_name: talentgeenie-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-talentgeenie}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - talentgeenie-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # Database migrations runner (runs on startup, safe for idempotent migrations)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migration
    container_name: talentgeenie-migrate
    restart: "no"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-talentgeenie}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - MIGRATIONS_DIR=/migrations
    depends_on:
      db:
        condition: service_healthy
    networks:
      - talentgeenie-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: talentgeenie-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - talentgeenie-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  talentgeenie-network:
    driver: bridge