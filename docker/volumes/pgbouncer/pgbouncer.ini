;; =============================================================================
;; PgBouncer Configuration — TalentGeenie
;; =============================================================================
;; Transaction pooling for Supabase multi-role architecture.
;; Auth: trust (internal Docker network only — not exposed to host).
;; =============================================================================

[databases]
;; All Supabase roles connect through PgBouncer to the same DB.
;; The "auth_user" is not set — connections pass through with trust.
postgres = host=db port=5432 dbname=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; Transaction pooling — best for web workloads (Supabase services).
;; Connection is returned to pool after each transaction completes.
pool_mode = transaction

;; Pool sizing
;; default_pool_size: connections per user/database pair
;; max_client_conn: total connections PgBouncer accepts from all clients
;; max_db_connections: max connections PgBouncer opens to PostgreSQL
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = 1000
max_db_connections = 100

;; Auth — trust within Docker network (no external exposure)
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

;; Required for PostgREST compatibility
ignore_startup_parameters = extra_float_digits

;; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

;; Admin access (for SHOW POOLS, etc.)
admin_users = postgres
stats_users = postgres

;; Server lifetime
server_idle_timeout = 600
server_lifetime = 3600
server_connect_timeout = 15
server_login_retry = 1
